
name: Build LeviSmooth

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared

      - name: Compile
        run: cmake --build build --config Release -j2

      - name: Package LeviSmooth
        run: |
          mkdir -p package
          cp build/liblevi_smooth.so package/liblevi_smooth.so

          cat > package/manifest.json <<'EOF'
          {
            "type": "preload-native",
            "name": "LeviSmooth",
            "author": "LeviSmooth",
            "version": "1.0.0",
            "entry": "liblevi_smooth.so",
            "minecraft_versions": [],
            "overwrite_files": [],
            "overwrite_folders": []
          }
          EOF

          cd package
          zip -r ../LeviSmooth.levipack .

      - name: Upload LeviSmooth
        uses: actions/upload-artifact@v4
        with:
          name: LeviSmooth
          path: LeviSmooth.levipack
          
