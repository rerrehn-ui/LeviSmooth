
name: Build LeviSmooth

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK and CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --licenses
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared

      - name: Compile
        run: cmake --build build --config Release -j2

      - name: Package LeviSmooth
        run: |
          mkdir -p package
          cp build/liblevi_smooth.so package/liblevi_smooth.so

          cat > package/manifest.json <<'EOF'
          {
            "type": "preload-native",
            "name": "LeviSmooth",
            "author": "LeviSmooth",
            "version": "1.0.0",
            "entry": "liblevi_smooth.so",
            "minecraft_versions": [],
            "overwrite_files": [],
            "overwrite_folders": []
          }
          EOF

          cd package
          zip -r ../LeviSmooth.levipack .

      - name: Upload LeviSmooth
        uses: actions/upload-artifact@v4
        with:
          name: LeviSmooth
          path: LeviSmooth.levipack
